name: CI

on:
  push:
    branches: [master, v1-0-0]
  pull_request:

# Cancel superseded PR runs (rapid pushes stack full matrices otherwise);
# push runs on the protected branches are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: bun run test

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install pinned Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      # generate_context! needs the built frontend (../dist) to exist.
      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        working-directory: src-tauri
        run: cargo build --locked

  supply-chain:
    name: Supply chain (audit + cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JS dependency vulnerabilities. The blocking gate audits PRODUCTION
      # dependencies only — those are what ship in the app bundle (Tauri packages
      # the Rust binary + the built frontend; dev tooling like the wdio E2E stack
      # never enters the shipped artifact). A real advisory in a shipped dep still
      # hard-fails here.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - name: bun audit (production deps — blocking)
        run: bun audit --audit-level=high --production

      # Dev-dependency advisories are surfaced but non-blocking: they matter for
      # local hygiene, but a transitive CVE in test tooling shouldn't gate a
      # release of code that never contains it. Review the log periodically.
      - name: bun audit (all deps — advisory only)
        continue-on-error: true
        run: bun audit --audit-level=high

      # Rust supply-chain gate: RustSec advisories + license policy + bans +
      # source allow-list. Config + documented exceptions live in
      # src-tauri/deny.toml (found next to the target manifest).
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          arguments: ''
          command: check

  crypto-compat:
    name: Crypto compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install pinned Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      # generate_context! needs the built frontend (../dist) to exist.
      - run: bun install --frozen-lockfile
      - run: bun run build

      # Rust decrypts the Node-generated golden fixtures and asserts plaintext.
      - name: Fixture + round-trip tests
        working-directory: src-tauri
        run: cargo test --locked

      # Rust encrypts -> Node decrypts, and vice versa.
      - name: Cross-implementation round-trip
        run: bun scripts/crypto-crosscheck.mjs

  e2e:
    name: E2E smoke suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb \
            unzip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install pinned Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      # generate_context! needs the built frontend (../dist) to exist.
      - run: bun run build

      - name: Build debug binary
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Run E2E tests
        run: xvfb-run --server-args="-screen 0 1280x800x24" bun run test:e2e
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: 1
          NO_AT_BRIDGE: 1

name: CI

on:
  push:
    branches: [master, v1-0-0]
  pull_request:

jobs:
  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: bun run test

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install pinned Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      # generate_context! needs the built frontend (../dist) to exist.
      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        working-directory: src-tauri
        run: cargo build --locked

  supply-chain:
    name: Supply chain (audit + cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JS dependency vulnerabilities. Blocks on high/critical advisories.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - name: bun audit
        run: bun audit --audit-level=high

      # Rust supply-chain gate: RustSec advisories + license policy + bans +
      # source allow-list. Config + documented exceptions live in
      # src-tauri/deny.toml (found next to the target manifest).
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          arguments: ''
          command: check

  crypto-compat:
    name: Crypto compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install pinned Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      # generate_context! needs the built frontend (../dist) to exist.
      - run: bun install --frozen-lockfile
      - run: bun run build

      # Rust decrypts the Node-generated golden fixtures and asserts plaintext.
      - name: Fixture + round-trip tests
        working-directory: src-tauri
        run: cargo test --locked

      # Rust encrypts -> Node decrypts, and vice versa.
      - name: Cross-implementation round-trip
        run: bun scripts/crypto-crosscheck.mjs

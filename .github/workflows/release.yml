# Builds, signs, notarizes and publishes Swifty for macOS, Windows and Linux as
# a DRAFT GitHub release, and uploads the `latest.json` update manifest that
# tauri-plugin-updater reads from `releases/latest/download/latest.json`.
# Publishing the draft is what makes a version visible to installed apps.
#
# One-time secret setup and the per-release procedure: docs/releasing.md.
# The same build can be run locally with scripts/release-local.sh (macOS only).
#
# Repository secrets used. The Apple/Google names are the ones already set on
# the repo (from the Electron-era release workflows); the Tauri bundler expects
# different env names, so they are mapped below.
#   CERTIFICATES_P12 / CERTIFICATES_P12_PASSWORD        base64 .p12 export of the "Developer ID Application"
#                                                       cert + its export password (macOS signing). It must
#                                                       be that certificate: the bundler compares the .p12
#                                                       against APPLE_SIGNING_IDENTITY and aborts on a
#                                                       mismatch (an "Apple Development" cert here failed
#                                                       a previous run).
#   APPLE_ID / APPLE_ID_PASSWORD / APPLE_TEAM_ID        Apple ID, app-specific password, team id (notarization)
#   TAURI_SIGNING_PRIVATE_KEY(_PASSWORD)                minisign key for updater artifact signatures
#   GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET Desktop OAuth client, baked in at compile time
#                                                       (src-tauri/src/sync/auth.rs)
# Windows installers are not code-signed (no certificate). macOS is signed and notarized.
#
# Before the build starts, the Tauri CLI checks that every @tauri-apps/* npm
# package and its Rust crate share a major.minor; a mismatch fails all three
# platforms. CI's supply-chain job runs the same check on every PR
# (scripts/check-tauri-versions.mjs) so it is caught before release day.

name: Release

# Manual, or on a version tag. Either way the release tag/name comes from
# `version` in src-tauri/tauri.conf.json (keep package.json + Cargo.toml in
# sync). Note: GitHub only offers "Run workflow" for workflows present on the
# repo's default branch; pushing a `v*` tag works from any branch.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  release:
    permissions:
      contents: write # create/update the GitHub release + upload assets
      id-token: write # OIDC token for SLSA build-provenance attestation (T-CI-4)
      attestations: write # record the provenance attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            bundlePath: src-tauri/target/universal-apple-darwin/release/bundle
          - platform: ubuntu-latest
            args: ''
            bundlePath: src-tauri/target/release/bundle
          # NSIS only. The MSI (WiX) bundler rejects a pre-release identifier
          # that is not purely numeric ("1.0.0-alpha.1" -> "optional pre-release
          # identifier in app version must be numeric-only"), and the updater
          # is happy with the NSIS -setup.exe. Drop the flag to ship an .msi as
          # well once versions are plain x.y.z.
          - platform: windows-latest
            args: '--bundles nsis'
            bundlePath: src-tauri/target/release/bundle
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      # Same pinned toolchain as ci.yml and local dev (rust-toolchain.toml is
      # the single source of truth). The two Apple targets are release-only:
      # Tauri lipos them into one universal binary.
      - name: Install pinned Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - name: Add Apple targets for the universal build
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Frontend toolchain is bun (matches ci.yml and the bun-based
      # beforeBuildCommand in tauri.conf.json; the repo ships bun.lock).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - run: bun install --frozen-lockfile

      - name: Build, sign, notarize and upload to the draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing (minisign keypair; pubkey in tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing (Developer ID Application cert) + notarization.
          # The identity string is the certificate's name, not a secret; it is
          # the output of `security find-identity -v -p codesigning`.
          APPLE_CERTIFICATE: ${{ secrets.CERTIFICATES_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATES_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: 'Developer ID Application: Oleksandr Chaplinsky (UFBL3F444A)'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Google Drive sync OAuth client, read via option_env! at compile time.
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        with:
          tagName: v__VERSION__
          releaseName: Swifty v__VERSION__
          releaseBody: See the assets below to download and install this version.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          tauriScript: bun run tauri
          args: ${{ matrix.args }}

      # Replace the placeholder release body with GitHub's auto-generated
      # release notes (the same "What's Changed" list the UI button produces),
      # built from PRs/commits since the previous release. Runs once, on Linux;
      # the draft can still be edited by hand before publishing.
      - name: Generate release notes
        if: matrix.platform == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(jq -r .version src-tauri/tauri.conf.json)"
          NOTES=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body)
          if [ -n "$NOTES" ] && [ "$NOTES" != "null" ]; then
            gh release edit "$TAG" --notes "$NOTES"
          fi

      # --- SLSA build provenance (T-CI-4) ---------------------------------
      # Attest the installers this platform produced. Each pattern that matches
      # nothing is simply skipped; every platform matches at least its own
      # installers, so the attestation always has a subject.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ matrix.bundlePath }}/**/*.dmg
            ${{ matrix.bundlePath }}/**/*.app.tar.gz
            ${{ matrix.bundlePath }}/**/*.deb
            ${{ matrix.bundlePath }}/**/*.rpm
            ${{ matrix.bundlePath }}/**/*.AppImage
            ${{ matrix.bundlePath }}/**/*.msi
            ${{ matrix.bundlePath }}/**/*-setup.exe

      # --- CycloneDX SBOM (T-CI-4) ----------------------------------------
      # Generated once, on Linux, and attached to the release. The Rust SBOM is
      # authoritative (cargo-cyclonedx over the full Cargo.lock); the JS SBOM is
      # best-effort and never fails the release.
      - name: Install cargo-cyclonedx
        if: matrix.platform == 'ubuntu-latest'
        run: cargo install cargo-cyclonedx --locked

      - name: Generate CycloneDX SBOMs
        if: matrix.platform == 'ubuntu-latest'
        run: |
          mkdir -p sbom
          cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json
          mv src-tauri/swifty.cdx.json sbom/swifty-rust.cdx.json
          npx --yes @cyclonedx/cdxgen@11 -t npm -o sbom/swifty-js.cdx.json . \
            || echo "JS SBOM generation skipped"

      - name: Attach SBOMs to the release
        if: matrix.platform == 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(jq -r .version src-tauri/tauri.conf.json)"
          gh release upload "$TAG" sbom/* --clobber

[package]
name = "swifty"
version = "1.0.0"
description = "Modern, Lightweight, Fast and Free Password Manager"
authors = ["Alex Chaplinsky"]
edition = "2021"
rust-version = "1.77"
# Desktop application, never published to crates.io.
publish = false

[lib]
name = "swifty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
rusqlite_migration = "1"
aes-gcm = "0.10"
ring = "0.17"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
totp-rs = { version = "5", default-features = false }
zxcvbn = "3"
dirs = "5"
log = "0.4.34"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
url = "2"
zeroize = "1.8.2"
argon2 = "0.5.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "block2"] }
block2 = "0.6"
# Biometric-gated Keychain (SecAccessControl / kSecAccessControlBiometryCurrentSet).
# OSX_10_15 enables the data-protection keychain required for biometric ACLs.
security-framework = { version = "3.6.0", features = ["OSX_10_15"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Security_Credentials_UI", "Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory"] }
# Credential Manager storage; retrieval is gated behind Windows Hello (verify-then-read).
keyring = { version = "3", features = ["windows-native"] }

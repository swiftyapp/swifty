[package]
name = "swifty"
version = "1.0.0-alpha.1"
description = "Modern, Lightweight, Fast and Free Password Manager"
authors = ["Alex Chaplinsky"]
edition = "2021"
rust-version = "1.77"
# Desktop application, never published to crates.io.
publish = false

[lib]
name = "swifty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-webdriver = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
rusqlite_migration = "1"
aes-gcm = "0.10"
ring = "0.17"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
totp-rs = { version = "5", default-features = false }
zxcvbn = "3"
dirs = "5"
log = "0.4.34"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
url = "2"
zeroize = "1.8.2"
argon2 = "0.5.3"
sys-locale = "0.3"
# WebAuthn authenticator core (1Password's passkey-rs, MIT OR Apache-2.0). Held
# at 0.4 deliberately: 0.5 declares rust-version 1.85.1, above this crate's
# 1.77 MSRV, so the MSRV-aware resolver refuses it. Revisit with the MSRV.
passkey-types = "0.4"
passkey-authenticator = "0.4"
# P-256 keys (PKCS#8 <-> COSE) and the COSE key type passkey-types speaks.
# Both pinned to what passkey-authenticator itself depends on, so exactly one
# copy of each is linked.
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
coset = "0.3"
# `CredentialStore` and `UserValidationMethod` are async traits; implementing
# them needs the same attribute macro passkey-authenticator declares them with.
async-trait = "0.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "block2"] }
block2 = "0.6"
# On-device text recognition (VNRecognizeTextRequest) for the image scanner.
# Only the headers the scanner touches are enabled; `objc2-core-foundation`
# gates the observation's bounding box, which is what puts lines in reading
# order.
objc2-vision = { version = "0.3.2", default-features = false, features = [
  "std",
  "VNRequest",
  "VNRequestHandler",
  "VNRecognizeTextRequest",
  "VNObservation",
  "VNTypes",
  "objc2-core-foundation",
] }
# Biometric-gated Keychain (SecAccessControl / kSecAccessControlBiometryCurrentSet).
# OSX_10_15 enables the data-protection keychain required for biometric ACLs.
security-framework = { version = "3.6.0", features = ["OSX_10_15"] }

[target.'cfg(target_os = "windows")'.dependencies]
# `Media_Ocr` + the imaging/storage stack it needs are for the image scanner:
# a file path -> SoftwareBitmap -> recognized lines.
windows = { version = "0.61", features = ["Security_Credentials_UI", "Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Media_Ocr", "Graphics_Imaging", "Storage", "Storage_Streams"] }
# Credential Manager storage; retrieval is gated behind Windows Hello (verify-then-read).
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
# A real WebAuthn client drives the authenticator through a full ceremony in the
# passkey tests (origin checks, clientDataJSON, attestation) instead of us
# hand-rolling CTAP2 requests. Test-only: the app never speaks WebAuthn itself.
passkey-client = "0.4"
# The CredentialStore/UserValidationMethod traits are async, so the tests need
# a runtime; `rt` (current-thread) + `macros` is the whole of it.
tokio = { version = "1", features = ["rt", "macros"] }

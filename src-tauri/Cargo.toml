[package]
name = "swifty"
version = "1.0.0"
description = "Modern, Lightweight, Fast and Free Password Manager"
authors = ["Alex Chaplinsky"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "swifty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false }
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
totp-rs = { version = "5", default-features = false }
dirs = "5"
log = "0.4.34"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
url = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

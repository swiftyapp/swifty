# Repo-wide cargo settings. Cargo discovers this file by walking up from its
# working directory (not from --manifest-path), so it is seen both by
# `tauri ios build`, which runs cargo from the repo root, and by direct
# `cargo --manifest-path src-tauri/Cargo.toml` invocations.

[env]
# Xcode 27's SwiftPM internalizes the SwiftRs runtime's @_cdecl exports, and
# they must be re-exported from exactly ONE archive or the linker sees duplicate
# globals. The patched swift-rs (src-tauri/Cargo.toml, [patch.crates-io])
# promotes them in the archive named here.
SWIFT_RS_RUNTIME_ARCHIVE = "Tauri"

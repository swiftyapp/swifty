<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` lets the shell paint under the notch and the home
      indicator; the safe-area insets it unlocks are what the compact chrome
      pads itself with. `maximum-scale=1` pins the scale: iOS otherwise zooms
      the page when a field whose text is under 16px is tapped (the 15px
      passphrase and search fields) and never zooms back, leaving the shell
      wider than the screen and shorter than it. The app is not a document, so
      it has nothing to pinch into either.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Swifty</title>
    <!--
      Pre-paint ground, so the very first frame the webview draws is already
      themed instead of a white flash (matters on reload and on the startup
      fallback path in window.rs). Values mirror `--c-app` in styles/theme.css;
      they have to be literal here because this paints before any CSS loads.
      Keyed off the OS rather than the stored preference — reading localStorage
      would need an inline script, which the CSP rightly forbids.
    -->
    <style>
      html {
        background: #e7e8ea;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #0f1011;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
